<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const InputField = ({ label, name, value, onChange, type = "text", placeholder = "", icon = "" }) => (
            <div className="mb-4">
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1 flex items-center gap-1.5">
                    {icon && <i className={`ph ${icon} text-indigo-400 text-sm`}></i>}
                    {label}
                </label>
                <input 
                    type={type} 
                    name={name} 
                    value={value} 
                    onChange={onChange}
                    placeholder={placeholder}
                    className="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-white placeholder-slate-500 text-sm transition-all shadow-inner"
                />
            </div>
        );

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('n1');
            
            const [notification, setNotification] = useState(null);
            const [savedProfiles, setSavedProfiles] = useState([]);
            
            const [isSyncing, setIsSyncing] = useState(false);
            const [showScriptGuide, setShowScriptGuide] = useState(false);

            const [config, setConfig] = useState({
                username: 'NALAKILAKI',
                password: 'NALAKILAKI',
                email: '',
                logoUrl: '',
                googleSheetUrl: '',
                ttdUrl: '',      /* Tanda Tangan Kades */
                stempelUrl: '',  /* Stempel Desa */
                ttdWidth: 140,   /* Lebar TTD (px) */
                stempelWidth: 90 /* Lebar Stempel (px) */
            });
            
            const [isForgotPass, setIsForgotPass] = useState(false);
            const [recoveryEmail, setRecoveryEmail] = useState('');
            const [resetStep, setResetStep] = useState(1);
            const [newPass, setNewPass] = useState('');
            const [settingsData, setSettingsData] = useState({
                username: '',
                password: '',
                email: '',
                googleSheetUrl: '',
                ttdWidth: 140,
                stempelWidth: 90
            });

            const [data, setData] = useState({
                jenisPemohon: 'L',
                nomorSurat: '',
                tanggalSurat: '',
                kades: '',
                kabupaten: '',
                kecamatan: '',
                desa: '',
                kodepos: '',
                provinsi: '',
                waktuAkad: '',
                tempatAkad: '',
                kuaTujuan: '',

                suamiNama: '',
                suamiNik: '',
                suamiTempatLahir: '',
                suamiTglLahir: '',
                suamiWarga: '',
                suamiAgama: '',
                suamiKerja: '',
                suamiAlamat: '',
                suamiStatus: '',
                
                ayahSuamiNama: '',
                ayahSuamiBin: '',
                ayahSuamiNik: '',
                ayahSuamiTempatLahir: '',
                ayahSuamiTglLahir: '',
                ayahSuamiWarga: '',
                ayahSuamiAgama: '',
                ayahSuamiKerja: '',
                ayahSuamiAlamat: '',

                ibuSuamiNama: '',
                ibuSuamiBinti: '',
                ibuSuamiNik: '',
                ibuSuamiTempatLahir: '',
                ibuSuamiTglLahir: '',
                ibuSuamiWarga: '',
                ibuSuamiAgama: '',
                ibuSuamiKerja: '',
                ibuSuamiAlamat: '',

                istriNama: '',
                istriNik: '',
                istriTempatLahir: '',
                istriTglLahir: '',
                istriWarga: '',
                istriAgama: '',
                istriKerja: '',
                istriAlamat: '',
                istriStatus: '',
                
                ayahIstriNama: '',
                ayahIstriBin: '',
                ayahIstriNik: '',
                ayahIstriTempatLahir: '',
                ayahIstriTglLahir: '',
                ayahIstriWarga: '',
                ayahIstriAgama: '',
                ayahIstriKerja: '',
                ayahIstriAlamat: '',

                ibuIstriNama: '',
                ibuIstriBinti: '',
                ibuIstriNik: '',
                ibuIstriTempatLahir: '',
                ibuIstriTglLahir: '',
                ibuIstriWarga: '',
                ibuIstriAgama: '',
                ibuIstriKerja: '',
                ibuIstriAlamat: ''
            });

            useEffect(() => {
                const saved = localStorage.getItem('sim_na_premium_saved');
                if (saved) {
                    try {
                        setSavedProfiles(JSON.parse(saved));
                    } catch (e) {
                        console.error("Gagal memuat data", e);
                    }
                }

                const savedConfig = localStorage.getItem('sim_na_config');
                if (savedConfig) {
                    try {
                        const parsed = JSON.parse(savedConfig);
                        setConfig(parsed);
                        setSettingsData({
                            username: parsed.username,
                            password: parsed.password,
                            email: parsed.email || '',
                            googleSheetUrl: parsed.googleSheetUrl || '',
                            ttdWidth: parsed.ttdWidth || 140,
                            stempelWidth: parsed.stempelWidth || 90
                        });
                    } catch (e) {
                        console.error("Gagal memuat config", e);
                    }
                } else {
                    setSettingsData({
                        username: 'NALAKILAKI',
                        password: 'NALAKILAKI',
                        email: '',
                        googleSheetUrl: '',
                        ttdWidth: 140,
                        stempelWidth: 90
                    });
                }
            }, []);
            
            useEffect(() => {
                if (isLoggedIn && config.googleSheetUrl) {
                    fetchFromGoogleSheet(config.googleSheetUrl, false);
                }
            }, [isLoggedIn, config.googleSheetUrl]);

            const showNotification = (msg, type = 'success') => {
                setNotification({ message: msg, type });
                setTimeout(() => setNotification(null), 3500);
            };

            const syncAllToSheet = async (profilesData, url = config.googleSheetUrl) => {
                if (!url) return;
                setIsSyncing(true);
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'sync_all', profiles: profilesData })
                    });
                    const result = await response.json();
                    if(result.status !== 'success') {
                         console.warn("GSheet Sync Warning:", result);
                    }
                } catch (error) {
                    console.error("GSheet Sync Error:", error);
                } finally {
                    setIsSyncing(false);
                }
            };

            const fetchFromGoogleSheet = async (url = config.googleSheetUrl, showMsg = true) => {
                if (!url) {
                    if(showMsg) showNotification("URL Google Sheet belum diatur!", "error");
                    return;
                }
                setIsSyncing(true);
                try {
                    const response = await fetch(`${url}?action=get_all`);
                    const result = await response.json();
                    if (result && result.status === 'success') {
                        const incomingData = Array.isArray(result.data) ? result.data.map(profile => {
                            const sanitizedData = {};
                            for (const key in profile.data) {
                                let val = profile.data[key];
                                if (typeof val === 'string' && val.includes('T') && val.includes('Z') && val.length >= 20) {
                                    const d = new Date(val);
                                    if(!isNaN(d.getTime())) {
                                        val = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
                                    }
                                }
                                sanitizedData[key] = val;
                            }
                            return { ...profile, data: sanitizedData };
                        }) : [];
                        
                        setSavedProfiles(incomingData);
                        localStorage.setItem('sim_na_premium_saved', JSON.stringify(incomingData));
                        if(showMsg) showNotification("Data riwayat berhasil ditarik & diperbarui dari Google Sheet!");
                    }
                } catch (error) {
                    console.error("GSheet Fetch Error:", error);
                    if(showMsg) showNotification("Gagal mengambil data dari Sheet. Periksa koneksi atau URL.", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            const saveCurrentData = () => {
                const newProfile = {
                    id: Date.now(),
                    date: new Date().toLocaleString('id-ID'),
                    label: `${data.suamiNama || 'Suami'} & ${data.istriNama || 'Istri'} (${data.jenisPemohon === 'L' ? 'Laki-laki' : 'Perempuan'})`,
                    data: { ...data }
                };
                const updatedProfiles = [newProfile, ...savedProfiles].slice(0, 50);
                setSavedProfiles(updatedProfiles);
                localStorage.setItem('sim_na_premium_saved', JSON.stringify(updatedProfiles));
                showNotification('Draft berhasil disimpan ke lokal & tersinkronisasi ke Cloud!');
                syncAllToSheet(updatedProfiles);
            };

            const loadData = (profile) => {
                setData(profile.data);
                showNotification(`Draft ${profile.label} berhasil dimuat!`);
            };

            const deleteProfile = (id) => {
                const updated = savedProfiles.filter(p => p.id !== id);
                setSavedProfiles(updated);
                localStorage.setItem('sim_na_premium_saved', JSON.stringify(updated));
                showNotification('Draft berhasil dihapus dari sistem & Cloud.', 'error');
                syncAllToSheet(updated);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (username.toUpperCase() === config.username.toUpperCase() && password === config.password) {
                    setIsAuthenticated(true);
                    setLoginError('');
                    showNotification('Autentikasi Berhasil! Selamat datang.');
                } else {
                    setLoginError('Kredensial tidak valid!');
                }
            };

            const saveConfig = (e) => {
                e.preventDefault();
                const newConfig = { 
                    ...config, 
                    username: settingsData.username,
                    password: settingsData.password,
                    email: settingsData.email,
                    googleSheetUrl: settingsData.googleSheetUrl,
                    ttdWidth: Number(settingsData.ttdWidth) || 140,
                    stempelWidth: Number(settingsData.stempelWidth) || 90
                };
                setConfig(newConfig);
                localStorage.setItem('sim_na_config', JSON.stringify(newConfig));
                showNotification('Pengaturan sistem berhasil disimpan!');
            };

            const getGoogleScriptTemplate = () => {
                return `function doGet(e) {
  if (e.parameter.action === 'get_all') {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var lastRow = sheet.getLastRow();
    var lastCol = sheet.getLastColumn();

    if (lastRow < 2) {
      return ContentService.createTextOutput(JSON.stringify({status: 'success', data: []}))
        .setMimeType(ContentService.MimeType.JSON);
    }

    var headers = sheet.getRange(1, 1, 1, lastCol).getValues()[0];
    var dataRange = sheet.getRange(2, 1, lastRow - 1, lastCol).getDisplayValues(); 

    var profiles = [];
    for (var i = 0; i < dataRange.length; i++) {
      var row = dataRange[i];
      var profile = { data: {} };
      
      for (var j = 0; j < headers.length; j++) {
        if (headers[j] === '_id') profile.id = row[j].toString();
        else if (headers[j] === '_date') profile.date = row[j];
        else if (headers[j] === '_label') profile.label = row[j];
        else profile.data[headers[j]] = row[j];
      }
      profiles.push(profile);
    }
    
    return ContentService.createTextOutput(JSON.stringify({status: 'success', data: profiles}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  
  return ContentService.createTextOutput("GSheet API Ready - Gunakan parameter ?action=get_all");
}

function doPost(e) {
  var parsedData = JSON.parse(e.postData.contents);
  
  if (parsedData.action === 'sync_all') {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var profiles = parsedData.profiles;

    sheet.clear();

    if (!profiles || profiles.length === 0) {
        return ContentService.createTextOutput(JSON.stringify({status: "success"}))
          .setMimeType(ContentService.MimeType.JSON);
    }

    var firstData = profiles[0].data || {};
    var dataHeaders = Object.keys(firstData);
    
    var fullHeaders = ['_id', '_date', '_label'].concat(dataHeaders);
    sheet.appendRow(fullHeaders);

    var rows = [];
    for (var i = 0; i < profiles.length; i++) {
        var p = profiles[i];
        var row = ["'" + p.id, "'" + p.date, "'" + p.label]; 
        
        for (var j = 0; j < dataHeaders.length; j++) {
            var cellValue = p.data[dataHeaders[j]] || "";
            if (typeof cellValue === 'string') {
                cellValue = "'" + cellValue;
            }
            row.push(cellValue);
        }
        rows.push(row);
    }

    if (rows.length > 0) {
       sheet.getRange(2, 1, rows.length, fullHeaders.length).setValues(rows);
    }

    return ContentService.createTextOutput(JSON.stringify({status: "success"}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const newConfig = { ...config, logoUrl: reader.result };
                        setConfig(newConfig);
                        localStorage.setItem('sim_na_config', JSON.stringify(newConfig));
                        showNotification('Logo berhasil diperbarui!');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleTtdUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const newConfig = { ...config, ttdUrl: reader.result };
                        setConfig(newConfig);
                        localStorage.setItem('sim_na_config', JSON.stringify(newConfig));
                        showNotification('Scan tanda tangan kades berhasil dimuat!');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleStempelUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const newConfig = { ...config, stempelUrl: reader.result };
                        setConfig(newConfig);
                        localStorage.setItem('sim_na_config', JSON.stringify(newConfig));
                        showNotification('Scan stempel desa berhasil dimuat!');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleRecovery = (e) => {
                e.preventDefault();
                if (resetStep === 1) {
                    if (!config.email) {
                        setLoginError('Sistem belum memiliki email pemulihan terdaftar. Hubungi Administrator.');
                    } else if (recoveryEmail.toLowerCase() === config.email.toLowerCase()) {
                        setResetStep(2);
                        setLoginError('');
                    } else {
                        setLoginError('Email tidak cocok dengan data terdaftar!');
                    }
                } else if (resetStep === 2) {
                    if (newPass.length < 4) {
                        setLoginError('Kata sandi minimal 4 karakter!');
                        return;
                    }
                    const newConfig = { ...config, password: newPass };
                    setConfig(newConfig);
                    localStorage.setItem('sim_na_config', JSON.stringify(newConfig));
                    
                    setSettingsData(prev => ({ ...prev, password: newPass }));
                    showNotification('Kata sandi berhasil direset! Silakan login.');
                    setIsForgotPass(false);
                    setResetStep(1);
                    setPassword('');
                    setNewPass('');
                    setRecoveryEmail('');
                }
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setData(prev => ({ ...prev, [name]: value.toUpperCase() }));
            };

            const setJenisPemohon = (jenis) => {
                setData(prev => ({ ...prev, jenisPemohon: jenis }));
            };

            const handlePrint = () => {
                window.print();
            };

            const handleDownloadPDF = () => {
                showNotification('Mempersiapkan dokumen PDF... Silakan pilih "Save as PDF" pada jendela printer.');
                setTimeout(() => {
                    window.print();
                }, 500);
            };

            const enterDocumentDashboard = () => {
                setIsLoggedIn(true);
                window.scrollTo(0, 0);
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(getGoogleScriptTemplate());
                showNotification('Script disalin ke clipboard!');
            }

            const tabs = [
                { id: 'n1', label: 'Model N1 (Pengantar)', icon: 'ph-file-text' },
                { id: 'n2', label: 'Model N2 (Permohonan)', icon: 'ph-file-text' },
                { id: 'n3', label: 'Model N3 (Persetujuan)', icon: 'ph-file-text' },
                { id: 'n4', label: 'Model N4 (Persetujuan N4)', icon: 'ph-file-text' },
                { id: 'n5', label: 'Model N5 (Izin Ortu)', icon: 'ph-file-text' },
                { id: 'rekomendasi', label: 'Rekomendasi Nikah', icon: 'ph-stamp' },
                { id: 'numpang', label: 'Numpang Nikah', icon: 'ph-file-text' },
                { id: 'belum_nikah', label: 'Ket. Belum Nikah', icon: 'ph-file-text' },
                { id: 'pengaturan', label: 'Pengaturan Sistem', icon: 'ph-gear' },
            ];

            const isMale = data.jenisPemohon === 'L';
            const pemohon = {
                nama: isMale ? data.suamiNama : data.istriNama,
                binBintiLabel: isMale ? 'Bin' : 'Binti',
                binBintiName: isMale ? data.ayahSuamiNama : data.ayahIstriNama,
                nik: isMale ? data.suamiNik : data.istriNik,
                jk: isMale ? 'LAKI-LAKI' : 'PEREMPUAN',
                tempatLahir: isMale ? data.suamiTempatLahir : data.istriTempatLahir,
                tglLahir: isMale ? data.suamiTglLahir : data.istriTglLahir,
                warga: isMale ? data.suamiWarga : data.istriWarga,
                agama: isMale ? data.suamiAgama : data.istriAgama,
                kerja: isMale ? data.suamiKerja : data.istriKerja,
                alamat: isMale ? data.suamiAlamat : data.istriAlamat,
                status: isMale ? data.suamiStatus : data.istriStatus,
            };

            const pasangan = {
                nama: isMale ? data.istriNama : data.suamiNama,
                binBintiLabel: isMale ? 'Binti' : 'Bin',
                binBintiName: isMale ? data.ayahIstriNama : data.ayahSuamiNama,
                nik: isMale ? data.istriNik : data.suamiNik,
                jk: isMale ? 'PEREMPUAN' : 'LAKI-LAKI',
                tempatLahir: isMale ? data.istriTempatLahir : data.suamiTempatLahir,
